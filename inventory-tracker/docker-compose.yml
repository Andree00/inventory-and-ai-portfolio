services:
  mysql:
    image: mysql:8.4
    command: --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: inventory_portfolio
      MYSQL_USER: inventory
      MYSQL_PASSWORD: local_inventory_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
